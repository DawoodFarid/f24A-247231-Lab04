<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Canteen</h1>
         <a href="till.html">Go to Till</a>
    </header>

    <main>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Line</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody id="sheet"></tbody>
        </table>

        <div>
    <p>Total: <span id="total">0</span></p>
    <p>Kind of total: <span id="totalKind"></span></p>
    <p>Kind of Note: <span id="noteKind"></span></p>
    <p>Price text matches price as a number: <span id="priceMatch"></span></p>
    <p>Are they the same kind: <span id="sameKind"></span></p>
    <p>Kind of Line: <span id="lineKind"></span></p>
</div>

        <form id="itemForm">
    <input type="text" id="item" placeholder="Item">
    <input type="number" id="quantity" placeholder="Quantity">
    <input type="text" id="price" placeholder="Price">
    <button type="submit">Add</button>
</form>

    </main>

    <footer>
        Roll Number: 247231
    </footer>

    <script src="script.js"></script>
</body>
</html>
